<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#173d66" />
  <!-- 데이터·서비스 워커 경로의 기준. src/logic/page.ts의 appUrl()이 읽습니다. -->
  <meta name="app-root" content="../" />
  <meta name="description" content="Notion에서 관리하는 외국어 스크립트를 문장 단위로 이어 듣기." />
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="icon" href="../icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
  <link rel="stylesheet" href="../src/styles.css" />
  <title>스크립트 듣기 · 다국어 단어장</title>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="identity"><a class="page-link" href="../">← 단어장으로</a><h1>스크립트 듣기</h1>
        <p>긴 글을 문장 단위로 이어 듣고, 읽는 문장을 따라가며 보기.</p></div>
    </header>

    <section class="panel" aria-label="스크립트 듣기">
      <div id="scriptStudy" class="script-study" hidden>
        <div class="settings-grid script-settings">
          <label class="script-picker">스크립트<select id="scriptSelect"></select></label>
          <label>전문 반복<select id="scriptRepeats"><option value="1">1회</option><option value="2">2회</option><option value="3">3회</option><option value="0">계속 반복</option></select></label>
          <label>문장 사이 대기<select id="sentenceDelay"><option value="0">없음</option><option value="400">0.4초</option><option value="800">0.8초</option><option value="1500">1.5초</option><option value="3000">3초</option></select></label>
          <label>문단 사이 대기<select id="paragraphDelay"><option value="0">없음</option><option value="700">0.7초</option><option value="1200">1.2초</option><option value="2000">2초</option><option value="4000">4초</option></select></label>
          <label>음성 속도 <span id="scriptRateValue">0.9×</span><input id="scriptRate" type="range" min="0.5" max="1.5" step="0.1" value="0.9" /></label>
          <label class="script-picker">음성 <span id="scriptVoiceLanguage" class="muted"></span><select id="scriptVoice"><option value="">자동 (기기 기본)</option></select></label>
        </div>
        <div class="display-options"><label class="check"><input id="showScriptTranslation" type="checkbox" checked /> 한국어 해석 표시</label>
          <label class="check"><input id="scriptPlayAll" type="checkbox" /> 모든 스크립트 이어 듣기</label></div>
        <div class="play-controls"><button id="scriptPlay" class="primary" type="button">▶ 이어서 재생</button><button id="scriptStop" type="button" disabled>■ 중지</button></div>
        <p class="muted info">문장을 누르면 그 문장부터 읽어요. 음성 목록은 기기에 설치된 음성이라 기기·브라우저마다 달라요. 화면 잠금 또는 다른 앱으로 전환할 때 재생이 중단될 수 있어요.</p>
        <article id="scriptText" class="script-text" aria-label="스크립트 본문"></article>
      </div>
      <p id="status" class="status" role="status" aria-live="polite">불러오는 중</p>
    </section>

    <footer>스크립트 편집은 Notion에서만 가능합니다. 듣던 위치와 설정은 현재 브라우저에 저장돼요.
      <span>GitHub Pages의 스크립트 데이터는 공개됩니다. 개인 정보는 넣지 마세요.</span>
    </footer>
  </main>
  <script type="module" src="../src/scriptPage.ts"></script>
</body>
</html>
