name: Sync Notion and deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'index.html'
      - 'script/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - '.node-version'
      - '.github/workflows/pages.yml'
  schedule:
    # 매 15분. GitHub 예약 작업은 늦어지거나 실행이 누락될 수 있습니다.
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: multilingual-vocab-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Download Notion words
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          # 스크립트 데이터베이스는 선택. 비어 있으면 스크립트 없이 배포합니다.
          NOTION_SCRIPTS_DATA_SOURCE_ID: ${{ secrets.NOTION_SCRIPTS_DATA_SOURCE_ID }}
          NOTION_SCRIPTS_DATABASE_ID: ${{ secrets.NOTION_SCRIPTS_DATABASE_ID }}
        shell: bash
        run: |
          # 저장소에는 단어 JSON이 없으므로 Notion 없이 배포하면 빈 앱이 됩니다.
          if [[ -z "$NOTION_TOKEN" || ( -z "$NOTION_DATA_SOURCE_ID" && -z "$NOTION_DATABASE_ID" ) ]]; then
            echo 'Notion secrets missing (NOTION_TOKEN and NOTION_DATA_SOURCE_ID or NOTION_DATABASE_ID); refusing deployment.' >&2
            exit 1
          fi
          # API 실패/응답 비정상 시 빌드 자체가 실패하며 이전 Pages 배포는 유지됩니다.
          npm run sync:notion -- --output public/data/words.json --scripts-output public/data/scripts.json
      - name: Build frontend
        run: npm run build
      - name: Notify on failure
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          # 15분 예약 실행이 계속 실패해도 이슈가 쌓이지 않도록, 열려 있는 알림 이슈를 재사용합니다.
          gh label create sync-failure --color B60205 \
            --description '자동 동기화/배포 실패 알림' 2>/dev/null || true
          open_issue=$(gh issue list --label sync-failure --state open --limit 1 \
            --json number --jq '.[0].number // empty')
          if [[ -n "$open_issue" ]]; then
            gh issue comment "$open_issue" --body "재실패: $RUN_URL"
          else
            gh issue create --label sync-failure --title '자동 동기화 또는 배포 실패' --body \
          "자동 실행이 실패했습니다. **기존 Pages 배포와 단어 JSON은 그대로 유지됩니다.**

          실패한 실행: $RUN_URL

          원인을 해결한 뒤 이 이슈를 닫아 주세요. 닫기 전까지 추가 실패는 이 이슈의 댓글로 누적됩니다."
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
